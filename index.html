<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luis Angel Arreguín — Product Designer</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #5f6368;
    --bg: #f4f5f6;
    --card-bg: #ffffff;
    --panel-bg: #f6f5f3;
    --line: #e5e3df;
    --accent: #2f7d8c;
    --maxw: 900px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
  }
  header {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 80px 24px 40px;
  }
  header h1 {
    font-size: 2rem;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  header p.role {
    color: var(--muted);
    font-size: 1.05rem;
    margin: 0 0 24px;
  }
  nav {
    display: flex;
    gap: 20px;
    font-size: 0.9rem;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
  }
  nav a { color: var(--ink); text-decoration: none; }
  nav a:hover { text-decoration: underline; }

  main { max-width: var(--maxw); margin: 0 auto; padding: 0 24px 100px; }

  section { padding: 56px 0; border-bottom: 1px solid var(--line); }
  section:last-child { border-bottom: none; }
  section h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 20px;
  }

  #about p { font-size: 1.05rem; max-width: 640px; }
